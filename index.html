<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My App</h1>
        <button id="darkModeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main>
        <div class="container">
            <h1>My Todos</h1>
            <div class="input-section">
                <input type="text" id="todoInput" placeholder="Add a new todo...">
                <select id="prioritySelect" aria-label="Priority">
                    <option value="high">High</option>
                    <option value="medium" selected>Medium</option>
                    <option value="low">Low</option>
                </select>
                <button id="addBtn">Add</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" id="sortByPriorityBtn" data-sort="priority">Sort by Priority</button>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <button id="selectAllBtn">Select All</button>
                <button id="markCompletedBtn">Mark as Completed</button>
                <button id="deleteCompletedBtn">Delete Completed</button>
            </div>

            <ul class="todoList" id="todoList"></ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

    <script type="module" src="/main.js"></script>
</body>
</html>
